<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blunder Fix • Import</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-wrap" data-page="import">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">BF</span>
          <div>
            <h1>Import Games</h1>
            <p>Step 1 of 3</p>
          </div>
        </div>
        <nav class="nav-pill">
          <a class="active" href="./import.html">Import</a>
          <a href="./analyze.html">Analyze</a>
          <a href="./review.html">Review</a>
          <a href="./stats.html">Stats</a>
        </nav>
      </header>

      <section class="glass-panel onboarding-panel">
        <h2>Import Games</h2>
        <p class="panel-note">Choose a source, enter one username, and import. PGN import is separate.</p>
        <div class="row wrap import-main-row">
          <label>Source
            <select id="importSource">
              <option value="lichess">Lichess</option>
              <option value="chesscom">Chess.com</option>
            </select>
          </label>
          <label>Username <input id="importUser" /></label>
          <label>Max Games <input id="importMax" type="number" value="100" min="1" max="2000" /></label>
          <button id="importGamesBtn">Import Games</button>
        </div>
        <div class="row wrap import-pgn-row">
          <label>PGN File <input id="pgnFile" type="file" accept=".pgn,text/plain,application/x-chess-pgn" /></label>
          <button id="importPgn">Import PGN</button>
        </div>
        <p id="importStatus" class="status">Idle</p>
        <div id="importNextWrap" class="row step-next-row" hidden>
          <button id="goAnalyzeBtn" class="step-cta-btn"><span>Analyze Games</span><i class="btn-icon bi bi-arrow-right-circle"></i></button>
        </div>
      </section>

      <section class="glass-panel">
        <h2>Database</h2>
        <div class="row wrap">
          <button id="exportDbBtn">Export DB</button>
          <input id="importDbFile" type="file" accept=".json,application/json" />
          <button id="importDbBtn" class="danger-btn">Import DB</button>
        </div>
      </section>

      <section class="glass-panel">
        <h2>Imported Profiles</h2>
        <div class="row">
          <button id="clearAllImportsBtn" class="danger-btn">Clear All Imports</button>
        </div>
        <div id="userCards" class="profiles-grid"></div>
      </section>

      <div id="importClearOverlay" class="settings-overlay" hidden>
        <div id="importClearBackdrop" class="settings-backdrop"></div>
        <section class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="importClearTitle">
          <h2 id="importClearTitle">Clear All Imports?</h2>
          <p>This removes all imported games, analysis positions, cards, and review history.</p>
          <div class="confirm-actions">
            <button id="importClearCancel">Cancel</button>
            <button id="importClearConfirm" class="danger-btn">Clear</button>
          </div>
        </section>
      </div>

    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
